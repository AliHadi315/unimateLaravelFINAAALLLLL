<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Assistant — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content" style="overflow:hidden">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div><div class="topbar-title">AI Study Assistant</div><div class="breadcrumb" id="session-label">New conversation</div></div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-ghost btn-sm" onclick="saveSession()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13"/><polyline points="7 3 7 8 15 8"/></svg>Save</button>
                <button class="clear-btn" onclick="confirmClear()" title="Clear chat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
            </div>
        </header>
        <div class="chat-shell">
            <div class="sessions-panel">
                <div class="sessions-panel-header">Chat History</div>
                <button class="new-session-btn" onclick="newSession()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Chat</button>
                <div class="sessions-list" id="sessions-list"></div>
            </div>
            <div class="chat-area">
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-empty" id="chat-empty">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <h3>AI Study Assistant</h3>
                        <p>Ask me anything about your courses, tasks, study tips, or academic concepts.</p>
                    </div>
                </div>
                <div class="chat-input-bar">
                    <textarea class="chat-textarea" id="chat-input" rows="1" placeholder="Ask about your courses, tasks, or study tips…"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Save Session -->
<div class="modal-overlay" id="modal-save">
    <div class="modal">
        <div class="modal-header"><h3 class="modal-title">Save Session</h3><button class="modal-close" onclick="closeModal('modal-save')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <div class="form-group"><label class="form-label">Session Title (optional)</label><input class="form-control" id="session-title-input" placeholder="e.g. Web Programming Study"/></div>
        <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('modal-save')">Cancel</button><button class="btn btn-primary" onclick="confirmSave()">Save</button></div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/ai.js"></script>
</body>
</html>
