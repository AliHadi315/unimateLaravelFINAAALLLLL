<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="auth-page">
<a href="../index.html" class="back-home">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Home
</a>
<div class="auth-card">
    <div class="auth-logo"><div class="logo-icon">UM</div><span class="logo-text">UniMate</span></div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your account to continue.</p>
    <div class="alert-box alert-error" id="alert-error"></div>
    <form id="login-form" novalidate>
        <div class="form-group">
            <label class="form-label" for="university-id">University ID</label>
            <input class="form-control" type="text" id="university-id" placeholder="e.g. 20230001" autocomplete="username"/>
            <div class="form-error" id="err-uid">Please enter your University ID.</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
                <input class="form-control" type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
                <button type="button" class="eye-btn" id="toggle-pw" aria-label="Toggle password">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="form-error" id="err-pw">Please enter your password.</div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="submit-btn" style="justify-content:center;padding:11px">Sign in</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
</div>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
