<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Statistics — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div><div class="topbar-title">Statistics</div><div class="breadcrumb">Track your academic progress</div></div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-ghost btn-sm" onclick="renderStats()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Refresh</button>
            </div>
        </header>
        <main class="page-body">
            <div class="stat-grid">
                <div class="stat-card"><div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div><div class="stat-info"><div class="stat-value" id="s-total">—</div><div class="stat-label">Total Tasks</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div class="stat-info"><div class="stat-value" id="s-completed">—</div><div class="stat-label">Completed</div></div></div>
                <div class="stat-card"><div class="stat-icon amber"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-info"><div class="stat-value" id="s-pending">—</div><div class="stat-label">Pending</div></div></div>
                <div class="stat-card"><div class="stat-icon red"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="stat-info"><div class="stat-value" id="s-overdue">—</div><div class="stat-label">Overdue</div></div></div>
            </div>
            <div class="card mb-3">
                <div class="flex-between mb-2"><h3>Overall Progress</h3><span class="text-sm text-muted" id="overall-pct">0%</span></div>
                <div class="progress-wrap" style="height:12px"><div class="progress-bar" id="overall-bar" style="width:0%"></div></div>
                <p class="text-sm mt-2 text-muted" id="overall-label">Loading…</p>
            </div>
            <div class="card mb-3"><h3 class="mb-3">Breakdown by Type</h3><div id="type-breakdown"></div></div>
            <div class="card"><h3 class="mb-3">Progress by Course</h3><div id="course-progress"></div></div>
        </main>
    </div>
</div>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/statistics.js"></script>
</body>
</html>
