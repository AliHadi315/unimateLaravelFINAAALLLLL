<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tasks &amp; Exams — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div><div class="topbar-title">Tasks &amp; Exams</div><div class="breadcrumb">All tasks across your courses</div></div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openAddTask()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Task</button>
            </div>
        </header>
        <main class="page-body">
            <div class="toolbar">
                <div class="search-bar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="form-control" type="text" id="search-input" placeholder="Search tasks…" oninput="renderTasks()"/></div>
                <select class="form-control" id="filter-status" onchange="renderTasks()"><option value="all">All</option><option value="pending">Pending</option><option value="completed">Completed</option><option value="overdue">Overdue</option><option value="today">Today</option><option value="thisWeek">This Week</option></select>
                <select class="form-control" id="filter-type" onchange="renderTasks()"><option value="all">All Types</option><option value="Assignment">Assignment</option><option value="Exam">Exam</option><option value="Project">Project</option></select>
                <select class="form-control" id="filter-priority" onchange="renderTasks()"><option value="all">All Priorities</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select>
                <select class="form-control" id="filter-course" onchange="renderTasks()"><option value="all">All Courses</option></select>
                <select class="form-control" id="sort-field" onchange="renderTasks()"><option value="due_date">Sort: Due Date</option><option value="priority">Sort: Priority</option><option value="title">Sort: Title</option></select>
                <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Reset</button>
            </div>
            <div class="card"><div id="tasks-list"></div></div>
        </main>
    </div>
</div>

<!-- Add/Edit Task -->
<div class="modal-overlay" id="modal-task">
    <div class="modal">
        <div class="modal-header"><h3 class="modal-title" id="task-modal-title">Add Task</h3><button class="modal-close" onclick="closeModal('modal-task')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <div class="form-group"><label class="form-label">Course *</label><select class="form-control" id="t-course"><option value="">— Select a course —</option></select><div class="form-error" id="err-t-course">Please select a course.</div></div>
        <div class="form-group"><label class="form-label">Task Title *</label><input class="form-control" id="t-title" placeholder="e.g. Midterm Exam"/><div class="form-error" id="err-t-title">Required.</div></div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Type</label><select class="form-control" id="t-type"><option value="Assignment">Assignment</option><option value="Exam">Exam</option><option value="Project">Project</option></select></div>
            <div class="form-group"><label class="form-label">Priority</label><select class="form-control" id="t-priority"><option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option></select></div>
        </div>
        <div class="form-group"><label class="form-label">Due Date *</label><input class="form-control" type="date" id="t-due"/><div class="form-error" id="err-t-due">Required.</div></div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="t-completed" style="width:16px;height:16px;cursor:pointer;accent-color:var(--blue)"/><label for="t-completed" class="form-label" style="margin:0;cursor:pointer">Mark as completed</label></div>
        <input type="hidden" id="t-edit-id"/>
        <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('modal-task')">Cancel</button><button class="btn btn-primary" onclick="saveTask()">Save Task</button></div>
    </div>
</div>

<!-- Delete Task -->
<div class="modal-overlay" id="modal-delete">
    <div class="modal">
        <div class="modal-header"><h3 class="modal-title">Delete Task</h3><button class="modal-close" onclick="closeModal('modal-delete')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <p class="confirm-text">Are you sure you want to delete this task? This cannot be undone.</p>
        <input type="hidden" id="delete-task-id"/>
        <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('modal-delete')">Cancel</button><button class="btn btn-danger" onclick="confirmDeleteTask()">Delete</button></div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/tasks.js"></script>
</body>
</html>
