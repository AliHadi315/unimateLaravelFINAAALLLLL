<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Messages — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content" style="overflow:hidden">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div><div class="topbar-title">Messages</div><div class="breadcrumb" id="chat-with">Classmates who share your courses</div></div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-ghost btn-sm history-toggle" onclick="toggleContactsPanel()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Contacts</button>
            </div>
        </header>
        <div class="chat-shell">
            <div class="sessions-panel" id="contacts-panel">
                <div class="sessions-panel-header">Conversations</div>
                <div class="sessions-list" id="contacts-list">
                    <div class="text-sm text-muted" style="padding:12px;text-align:center">Loading…</div>
                </div>
            </div>
            <div class="chat-area">
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-empty" id="chat-empty">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <h3>Message your classmates</h3>
                        <p id="chat-empty-hint">Pick a course group or classmate on the left. Each of your course codes has a group chat with everyone at your university taking it.</p>
                    </div>
                </div>
                <div class="chat-input-bar hidden" id="msg-input-bar">
                    <textarea class="chat-textarea" id="msg-input" rows="1" placeholder="Write a message…"></textarea>
                    <button class="send-btn" id="msg-send-btn" onclick="sendChatMessage()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="/js/app.js"></script>
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/messages.js"></script>
</body>
</html>
